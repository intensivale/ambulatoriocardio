<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prontuário · Ambulatório Escola FAMED</title>
<style>
:root{
  --bg:#f5f4ef; --card:#fff; --ink:#27261f; --muted:#6f6c60; --line:#dedbd0;
  --brand:#4b6a3f; --brand-d:#37502e; --brown:#6b5d3f; --danger:#a63d2f; --warn:#9a6a14;
  --soft:#eef2ea; --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
h1{font-size:1.35rem;margin:0 0 2px}
h2{font-size:1.15rem;margin:0 0 12px}
h3{font-size:.95rem;margin:0 0 8px;color:var(--brown);letter-spacing:.01em}
.muted{color:var(--muted)} .small{font-size:.85rem}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between;align-items:flex-start}
.row.end{justify-content:flex-end;margin-top:14px}

.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:960px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.top img{height:36px;display:block}
.top strong{color:var(--brown)}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}

.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;min-height:38px}
.btn:hover{background:#f3f1ea}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brown)}
.btn.danger{color:var(--danger);border-color:#e3c3bd}
.btn[disabled]{opacity:.5;cursor:default}
.link{font:inherit;background:none;border:0;color:var(--brand-d);cursor:pointer;padding:4px 0;margin-bottom:8px}
.link:hover{text-decoration:underline}

.inp,textarea,select{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.inp:focus,textarea:focus,select:focus{outline:2px solid #b8cdae;border-color:var(--brand)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
.fld{margin:0 0 12px}
.fld>label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.ro{white-space:pre-wrap;padding:8px 0;border-bottom:1px dashed var(--line)}
.pre{white-space:pre-wrap}

.seg{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.seg button{font:inherit;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--soft);border-color:var(--brand);color:var(--brand-d);font-weight:600}

.pac,.item{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 8px;cursor:pointer}
.pac:hover,.item:hover{border-color:var(--brand);background:#fbfcf9}
.pac-n{font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--soft);color:var(--brand-d);border-radius:99px;padding:2px 10px;font-size:.85rem;display:inline-flex;align-items:center;gap:6px}
.chip.hit{background:#fff1c9;color:#6b4a00}
.chip button{border:0;background:none;cursor:pointer;color:inherit;font-size:1rem;line-height:1;padding:0}
.chips.sm .chip{font-size:.78rem;padding:1px 8px}
.cnt{margin:2px 2px 8px}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto}
.tabs button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{border-color:var(--brand);color:var(--brand-d);font-weight:600}

.badge{font-size:.75rem;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge.rascunho{background:#fbefd2;color:var(--warn)}
.badge.finalizada{background:var(--soft);color:var(--brand-d)}

.bar{position:sticky;top:52px;z-index:15;background:var(--bg);padding:8px 0;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#save-st{font-size:.85rem;color:var(--muted)}
.exam{padding:8px 0;border-bottom:1px solid var(--line)}
.exam:last-child{border-bottom:0}
details{margin:0 0 10px} summary{cursor:pointer;color:var(--brown);font-weight:600;padding:4px 0}
.add-box{background:#faf9f5;border:1px dashed var(--line);border-radius:8px;padding:12px;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}.wrap{padding:12px}.top img{height:30px}.top .muted{display:none}.top-in{gap:8px}}

.login{max-width:380px;margin:8vh auto;padding:0 16px}
.login img{width:100%;max-width:300px;display:block;margin:0 auto 14px}
.warn-box{background:#fbefd2;border:1px solid #e6cf94;color:#5b4208;border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:.9rem}
.err{color:var(--danger);font-size:.9rem;min-height:1.3em;margin:6px 0 0}

dialog{border:0;border-radius:12px;padding:0;width:min(440px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg-in{padding:18px}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2d2b24;color:#fff;padding:10px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1} #toast.err{background:var(--danger)}

/* ===== Receituário (impressão A4) ===== */
#print-area{display:none}
@media print{
  @page{size:A4;margin:14mm 16mm 12mm}
  html,body{background:#fff!important}
  body *{visibility:hidden}
  #app,#toast,dialog{display:none!important}
  #print-area{display:block}
  #print-area,#print-area *{visibility:visible}
  .rx-t{width:100%;border-collapse:collapse;color:#000;font-family:Georgia,"Times New Roman",serif}
  .rx-t td{padding:0;vertical-align:top}
  .rx-head{padding-bottom:5mm;border-bottom:1px solid #8a8168;margin-bottom:7mm}
  .rx-head img{height:24mm;display:block}
  .rx-meta{display:flex;justify-content:space-between;gap:10mm;font-size:11.5pt;margin-bottom:8mm}
  .rx-body{white-space:pre-wrap;font-size:12.5pt;line-height:1.65;min-height:110mm}
  .rx-sign{width:75mm;margin:28mm auto 0;border-top:1px solid #444;height:1px;page-break-inside:avoid}
  .rx-spacer{height:16mm}
  .rx-foot{position:fixed;left:0;right:0;bottom:0;border-top:1px solid #8a8168;padding-top:2.5mm;text-align:center;font:9pt Georgia,"Times New Roman",serif;color:#444;background:#fff}
}
</style>
</head>

<dialog id="dlg"></dialog>

const CONFIGURADO = !String(firebaseConfig.apiKey).startsWith("COLE");
let auth, db;
if (CONFIGURADO) { const app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app); }

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim().replace(/\s+/g, " ");
const hojeISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const fmtData = iso => iso ? iso.split("-").reverse().join("/") : "";
const fmtTs = ts => { const d = ts?.toDate?.(); return d ? d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : ""; };
const hora = () => new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const trunc = (s, n) => (s || "").length > n ? s.slice(0, n).trim() + "…" : (s || "");
const SEXO = { F: "Feminino", M: "Masculino", O: "Outro / não informado" };
function idadeTxt(nasc) {
  if (!nasc) return "";
  const [y, m, d] = nasc.split("-").map(Number), h = new Date();
  let meses = (h.getFullYear() - y) * 12 + (h.getMonth() + 1 - m);
  if (h.getDate() < d) meses--;
  if (meses < 24) return Math.max(meses, 0) + (meses === 1 ? " mês" : " meses");
  const a = Math.floor(meses / 12);
  return a + " anos";
}
function toast(msg, isErr) {
  const t = $("#toast"); t.textContent = msg; t.className = "on" + (isErr ? " err" : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = "", isErr ? 5000 : 2500);
}
function erro(e) {
  console.error(e);
  const c = e?.code || "";
  if (c.includes("permission-denied")) toast("Permissão negada pelo Firestore. Confira as regras e o UID do seu usuário.", true);
  else if (c.includes("unavailable") || c.includes("network")) toast("Sem conexão com o servidor. Tente novamente.", true);
  else toast("Erro: " + (e?.message || e), true);
}

const S = {
  user: null, pacientes: [], pool: [], unsub: null,
  view: "login", busca: "", modo: "todos",
  paciente: null, consultas: [], exames: [], prescricoes: [], tab: "consultas",
  consulta: null, adendos: [], cTab: "consulta", rx: "",
  dirty: false, ver: 0, saveTimer: null
};
const CAMPOS = ["queixa", "hma", "hpp", "medicacoes", "hfam", "hsocial", "exameFisico", "evolucao", "conduta"];
const refPac = id => doc(db, "pacientes", id);
const refCons = id => doc(db, "pacientes", S.paciente.id, "consultas", id);
const colPac = sub => collection(db, "pacientes", S.paciente.id, sub);

/* ---------- dados ---------- */
function iniciarPacientes() {
  S.unsub?.();
  S.unsub = onSnapshot(collection(db, "pacientes"), snap => {
    S.pacientes = snap.docs.map(d => {
      const p = { id: d.id, ...d.data() };
      p._nome = norm(p.nome); p._diag = (p.diagnosticosAtuais || []).map(norm);
      return p;
    });
    const cont = new Map();
    S.pacientes.forEach(p => (p.diagnosticosAtuais || []).forEach(d => {
      const k = norm(d), e = cont.get(k) || { k, txt: d, n: 0 }; e.n++; cont.set(k, e);
    }));
    S.pool = [...cont.values()].sort((a, b) => b.n - a.n || a.txt.localeCompare(b.txt));
    atualizarDatalist();
    if (S.view === "home") renderLista();
  }, erro);
}
function atualizarDatalist() { $("#dl-diag").innerHTML = S.pool.map(x => `<option value="${esc(x.txt)}">`).join(""); }

async function carregarPaciente(id) {
  const q = (sub, campo, dir) => getDocs(query(collection(db, "pacientes", id, sub), orderBy(campo, dir)));
  const [p, c, e, r] = await Promise.all([getDoc(refPac(id)), q("consultas", "criadoEm", "desc"), q("exames", "data", "desc"), q("prescricoes", "criadoEm", "desc")]);
  if (!p.exists()) throw new Error("Paciente não encontrado.");
  S.paciente = { id, ...p.data() };
  S.consultas = c.docs.map(d => ({ id: d.id, ...d.data() }));
  S.exames = e.docs.map(d => ({ id: d.id, ...d.data() }));
  S.prescricoes = r.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function recarregarExames() {
  const s = await getDocs(query(colPac("exames"), orderBy("data", "desc")));
  S.exames = s.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function recarregarRx() {
  const s = await getDocs(query(colPac("prescricoes"), orderBy("criadoEm", "desc")));
  S.prescricoes = s.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function carregarAdendos() {
  const s = await getDocs(query(collection(db, "pacientes", S.paciente.id, "consultas", S.consulta.id, "adendos"), orderBy("criadoEm", "asc")));
  S.adendos = s.docs.map(d => ({ id: d.id, ...d.data() }));
}

/* ---------- navegação ---------- */
async function abrirPaciente(id) {
  await carregarPaciente(id);
  S.tab = "consultas"; S.view = "paciente"; render(); scrollTo(0, 0);
}
async function abrirConsulta(cid) {
  const snap = await getDoc(refCons(cid));
  S.consulta = { id: cid, ...snap.data() };
  S.consulta.diagnosticos = S.consulta.diagnosticos || [];
  S.adendos = []; if (S.consulta.status === "finalizada") await carregarAdendos();
  S.cTab = "consulta"; S.rx = ""; S.dirty = false; S.view = "consulta"; render(); scrollTo(0, 0);
}
async function irHome() {
  if (S.view === "consulta" && !(await salvar())) return;
  S.view = "home"; render();
}

/* ---------- renderização ---------- */
function topbar() {
  return `<header class="top"><div class="top-in"><img src="${LOGO}" alt="FAMED UFVJM">
    <div class="grow"><strong>Prontuário Eletrônico</strong><div class="muted small">Ambulatório Escola · FAMED/UFVJM</div></div>
    ${S.user ? `<button class="btn ghost" data-act="home">Pacientes</button><button class="btn ghost" data-act="sair">Sair</button>` : ""}</div></header>`;
}
function render() {
  let h;
  if (S.view === "login") h = viewLogin();
  else h = topbar() + (S.view === "home" ? viewHome() : S.view === "paciente" ? viewPaciente() : viewConsulta());
  $("#app").innerHTML = h;
  if (S.view === "home") renderLista();
  if (S.view === "consulta") autosize();
}

function viewLogin() {
  return `<main class="login"><form class="card" id="login" autocomplete="on">
    <img src="${LOGO}" alt="Faculdade de Medicina UFVJM">
    <h2 style="text-align:center">Prontuário Eletrônico</h2>
    ${CONFIGURADO ? "" : `<div class="warn-box">Firebase ainda não configurado. Cole o <b>firebaseConfig</b> do seu projeto no início do script do <code>index.html</code>.</div>`}
    <div class="fld"><label for="em">E-mail</label><input class="inp" id="em" type="email" required autocomplete="username"></div>
    <div class="fld"><label for="pw">Senha</label><input class="inp" id="pw" type="password" required autocomplete="current-password"></div>
    <button class="btn primary" style="width:100%" ${CONFIGURADO ? "" : "disabled"}>Entrar</button>
    <div class="err" id="login-err"></div></form></main>`;
}

function viewHome() {
  const modos = [["todos", "Nome ou diagnóstico"], ["nome", "Só nome"], ["diag", "Só diagnóstico"]];
  return `<main class="wrap">
    <div class="row"><input id="q" class="inp grow" type="search" placeholder="Buscar por nome ou diagnóstico…" value="${esc(S.busca)}" autocomplete="off">
    <button class="btn primary" data-act="novo-pac">+ Novo paciente</button></div>
    <div class="seg">${modos.map(([v, l]) => `<button class="${S.modo === v ? "on" : ""}" data-act="modo" data-v="${v}">${l}</button>`).join("")}</div>
    ${S.modo === "diag" ? `<div class="muted small cnt">Em “Só diagnóstico”, todos os termos precisam estar no mesmo diagnóstico (lista atual do paciente).</div>` : ""}
    <div id="lista"></div></main>`;
}
function buscar() {
  const termos = norm(S.busca).split(" ").filter(Boolean);
  let r = S.pacientes;
  if (termos.length) {
    r = r.filter(p => {
      if (S.modo === "diag") return p._diag.some(d => termos.every(t => d.includes(t)));
      if (S.modo === "nome") return termos.every(t => p._nome.includes(t));
      return termos.every(t => p._nome.includes(t) || p._diag.some(d => d.includes(t)));
    });
  }
  return [...r].sort((a, b) => a._nome.localeCompare(b._nome));
}
function renderLista() {
  const el = $("#lista"); if (!el) return;
  if (!S.pacientes.length) { el.innerHTML = `<div class="empty">Nenhum paciente cadastrado ainda. Use “+ Novo paciente”.</div>`; return; }
  const r = buscar(), termos = norm(S.busca).split(" ").filter(Boolean);
  if (!r.length) { el.innerHTML = `<div class="empty">Nenhum paciente encontrado.</div>`; return; }
  el.innerHTML = `<div class="muted small cnt">${r.length} paciente${r.length > 1 ? "s" : ""}${r.length > 300 ? " (mostrando 300)" : ""}</div>` +
    r.slice(0, 300).map(p => `<button class="pac" data-act="abrir-pac" data-id="${p.id}">
      <div class="pac-n">${esc(p.nome)}</div>
      <div class="muted small">${SEXO[p.sexo] || ""} · ${idadeTxt(p.nascimento)} · nasc. ${fmtData(p.nascimento)}${p.ultimaConsulta ? " · última consulta " + fmtData(p.ultimaConsulta) : ""}</div>
      <div class="chips sm">${(p.diagnosticosAtuais || []).map(d => `<span class="chip${S.modo !== "nome" && termos.some(t => norm(d).includes(t)) ? " hit" : ""}">${esc(d)}</span>`).join("")}</div></button>`).join("");
}

function chipsHtml(arr, ro) {
  return arr.length ? arr.map((d, i) => `<span class="chip">${esc(d)}${ro ? "" : `<button type="button" data-act="rm-diag" data-i="${i}" title="Remover" aria-label="Remover">×</button>`}</span>`).join("") : `<span class="muted">—</span>`;
}
function rxItem(r) {
  return `<div class="exam"><div class="row between"><div class="small muted">Emitida em ${fmtData(r.dataEmissao)}</div>
    <div class="row"><button class="btn" data-act="rx-print" data-id="${r.id}">Imprimir / PDF</button>${S.view === "consulta" && S.cTab === "prescricao" ? `<button class="btn ghost" data-act="rx-base" data-id="${r.id}">Usar como base</button>` : ""}</div></div>
    <div class="pre" style="margin-top:6px">${esc(trunc(r.texto, 400))}</div></div>`;
}
function listaExames(arr) {
  if (!arr.length) return `<div class="muted">Nenhum exame registrado.</div>`;
  const grupo = (tipo, titulo) => {
    const l = arr.filter(e => e.tipo === tipo);
    return l.length ? `<h3 style="margin-top:10px">${titulo}</h3>` + l.map(e => `<div class="exam"><div class="small muted">${fmtData(e.data)}</div><div class="pre">${esc(e.texto)}</div></div>`).join("") : "";
  };
  return grupo("lab", "Laboratoriais") + grupo("img", "Imagem");
}

function viewPaciente() {
  const p = S.paciente, rasc = S.consultas.find(c => c.status === "rascunho");
  const tabs = [["consultas", `Consultas (${S.consultas.length})`], ["exames", `Exames (${S.exames.length})`], ["prescricoes", `Prescrições (${S.prescricoes.length})`]];
  let corpo = "";
  if (S.tab === "consultas") {
    corpo = S.consultas.length ? S.consultas.map(c => `<button class="item" data-act="abrir-consulta" data-id="${c.id}">
      <div class="row between"><b>${c.tipo === "primeira" ? "Primeira consulta" : "Retorno"} · ${fmtData(c.dataConsulta)}</b><span class="badge ${c.status}">${c.status === "rascunho" ? "Rascunho" : "Finalizada"}</span></div>
      <div class="muted small">${esc(trunc(c.conduta || c.evolucao || c.queixa || "", 140))}</div></button>`).join("") : `<div class="empty">Nenhuma consulta registrada.</div>`;
  } else if (S.tab === "exames") corpo = `<div class="card">${listaExames(S.exames)}</div>`;
  else corpo = `<div class="card">${S.prescricoes.length ? S.prescricoes.map(rxItem).join("") : `<div class="muted">Nenhuma prescrição emitida.</div>`}</div>`;
  return `<main class="wrap"><button class="link" data-act="home">← Pacientes</button>
    <section class="card"><div class="row between"><div><h1>${esc(p.nome)}</h1>
      <div class="muted">${SEXO[p.sexo] || ""} · ${idadeTxt(p.nascimento)} · nasc. ${fmtData(p.nascimento)}</div></div>
      <button class="btn ghost" data-act="edit-pac">Editar cadastro</button></div>
      <h3 style="margin-top:14px">Diagnósticos atuais</h3><div class="chips">${chipsHtml(p.diagnosticosAtuais || [], true)}</div>
      <h3 style="margin-top:10px">Medicações de uso atual</h3><div class="pre">${esc(p.medicacoesAtuais) || `<span class="muted">—</span>`}</div>
      <div class="row" style="margin-top:14px">${rasc
        ? `<button class="btn primary" data-act="abrir-consulta" data-id="${rasc.id}">Retomar rascunho (${fmtData(rasc.dataConsulta)})</button>`
        : `<button class="btn primary" data-act="nova-consulta">${S.consultas.length ? "Nova consulta (retorno)" : "Primeira consulta"}</button>`}</div></section>
    <div class="tabs">${tabs.map(([v, l]) => `<button class="${S.tab === v ? "on" : ""}" data-act="tab" data-v="${v}">${l}</button>`).join("")}</div>${corpo}</main>`;
}

/* ---- consulta ---- */
const fldTxt = (campo, label, rows, ro) => {
  const v = S.consulta[campo] || "";
  return `<div class="fld"><label>${label}</label>${ro ? `<div class="ro">${esc(v) || `<span class="muted">—</span>`}</div>` : `<textarea data-campo="${campo}" rows="${rows}">${esc(v)}</textarea>`}</div>`;
};
const sec = (titulo, inner, id) => `<section class="card"${id ? ` id="${id}"` : ""}><h3>${titulo}</h3>${inner}</section>`;

function examesBoxHtml() {
  const c = S.consulta, ro = c.status !== "rascunho";
  const atuais = S.exames.filter(e => e.consultaId === c.id), ant = S.exames.filter(e => e.consultaId !== c.id);
  let h = "";
  if (!ro && ant.length) h += `<details open><summary>Exames anteriores (${ant.length})</summary>${listaExames(ant)}</details>`;
  h += `<h3 style="margin-top:6px">${ro ? "Exames desta consulta" : "Novos exames desta consulta"}</h3>`;
  h += atuais.length ? atuais.map(e => `<div class="exam"><div class="row between"><div class="small muted">${e.tipo === "lab" ? "Laboratorial" : "Imagem"} · ${fmtData(e.data)}</div>${ro ? "" : `<button class="btn ghost danger" data-act="ex-rm" data-id="${e.id}">Remover</button>`}</div><div class="pre">${esc(e.texto)}</div></div>`).join("") : `<div class="muted">Nenhum.</div>`;
  if (!ro) h += `<div class="add-box"><div class="grid2"><div class="fld"><label>Tipo</label><select id="ex-tipo" class="inp"><option value="lab">Laboratorial</option><option value="img">Imagem</option></select></div>
    <div class="fld"><label>Data do exame</label><input id="ex-data" type="date" class="inp" value="${hojeISO()}" max="${hojeISO()}"></div></div>
    <div class="fld"><label>Resultado / descrição</label><textarea id="ex-texto" rows="4"></textarea></div>
    <button class="btn" data-act="ex-add">Adicionar exame</button></div>`;
  return h;
}
function renderExamesBox() { const el = $("#exames-box"); if (el) el.innerHTML = examesBoxHtml(); }
function renderChips() { const el = $("#chips"); if (el) el.innerHTML = chipsHtml(S.consulta.diagnosticos, S.consulta.status !== "rascunho"); }

function secDiag(ro, titulo) {
  return sec(titulo, `<div class="chips" id="chips">${chipsHtml(S.consulta.diagnosticos, ro)}</div>` + (ro ? "" :
    `<div class="row"><input id="diag-in" class="inp grow" list="dl-diag" placeholder="Digite um diagnóstico e pressione Enter" autocomplete="off"><button type="button" class="btn" data-act="add-diag">Adicionar</button></div>
     <div class="muted small" style="margin-top:6px">Sugestões vêm dos diagnósticos já usados, para manter a grafia consistente.</div>`));
}
function consultaForm() {
  const c = S.consulta, ro = c.status !== "rascunho", prim = c.tipo === "primeira", f = (k, l, r) => fldTxt(k, l, r, ro);
  const exames = sec("Exames", `<div id="exames-box">${examesBoxHtml()}</div>`);
  let h = "";
  if (prim) {
    h += sec("Anamnese", f("queixa", "Queixa principal", 2) + f("hma", "HMA — história da moléstia atual", 6) + f("hpp", "HPP — história patológica pregressa", 3) +
      f("medicacoes", "Medicações de uso regular", 3) + f("hfam", "HFam — história familiar", 2) + f("hsocial", "HSocial — história social", 2));
    h += sec("Exame físico", f("exameFisico", "Exame físico", 5)) + exames + secDiag(ro, "Lista de doenças") + sec("Conduta", f("conduta", "Conduta", 5));
  } else {
    h += secDiag(ro, "Diagnósticos presentes") + sec("Evolução", f("evolucao", "Evolução desde a última consulta", 5)) +
      sec("Medicações de uso atual", f("medicacoes", "Medicações de uso atual", 3)) + sec("Exame físico", f("exameFisico", "Exame físico", 5)) +
      exames + sec("Conduta", f("conduta", "Conduta", 5));
  }
  if (ro) {
    h += sec("Adendos", (S.adendos.length ? S.adendos.map(a => `<div class="exam"><div class="small muted">${fmtTs(a.criadoEm)}</div><div class="pre">${esc(a.texto)}</div></div>`).join("") : `<div class="muted">Nenhum adendo.</div>`) +
      `<div class="add-box"><div class="fld"><label>Novo adendo (a consulta original não é alterada)</label><textarea id="ad-txt" rows="3"></textarea></div><button class="btn" data-act="ad-add">Registrar adendo</button></div>`);
  }
  return h;
}
function prescricaoTab() {
  const lista = S.prescricoes.filter(r => r.consultaId === S.consulta.id);
  return `<section class="card"><h3>Nova prescrição</h3>
    <div class="fld" style="max-width:220px"><label>Data</label><input id="rx-data" type="date" class="inp" value="${hojeISO()}"></div>
    <div class="fld"><label>Prescrição</label><textarea id="rx-txt" rows="12" placeholder="Digite a prescrição…">${esc(S.rx)}</textarea></div>
    <div class="row"><button class="btn" data-act="rx-meds">Inserir medicações de uso atual</button><span class="grow"></span>
    <button class="btn primary" data-act="rx-emitir">Emitir e imprimir / salvar PDF</button></div>
    <p class="muted small" style="margin-bottom:0">Depois de emitida, a prescrição fica gravada e não pode ser alterada. Na janela de impressão, escolha “Salvar como PDF” se preferir e desmarque “Cabeçalhos e rodapés”.</p></section>
    <section class="card"><h3>Prescrições desta consulta</h3>${lista.length ? lista.map(rxItem).join("") : `<div class="muted">Nenhuma emitida.</div>`}</section>`;
}
function viewConsulta() {
  const c = S.consulta, p = S.paciente, ro = c.status !== "rascunho";
  return `<main class="wrap"><button class="link" data-act="voltar-pac">← ${esc(p.nome)}</button>
    <div class="row between" style="margin-bottom:6px"><div><h2 style="margin:0">${c.tipo === "primeira" ? "Primeira consulta" : "Retorno"}</h2>
      <div class="muted small">${ro ? `Finalizada em ${fmtTs(c.finalizadaEm)} · bloqueada para edição` : ""}</div></div>
      ${ro ? "" : `<div class="fld" style="margin:0"><label>Data da consulta</label><input type="date" class="inp" data-campo="dataConsulta" value="${c.dataConsulta || ""}" max="${hojeISO()}"></div>`}
      ${ro ? `<div><b>${fmtData(c.dataConsulta)}</b></div>` : ""}</div>
    <div class="bar">${ro ? `<span class="badge finalizada">Finalizada</span>` : `<span class="badge rascunho">Rascunho</span><span id="save-st">Salvo</span><span class="grow"></span>
      <button class="btn danger" data-act="descartar">Descartar</button><button class="btn primary" data-act="finalizar">Finalizar consulta</button>`}</div>
    <div class="tabs"><button class="${S.cTab === "consulta" ? "on" : ""}" data-act="c-tab" data-v="consulta">Consulta</button>
      <button class="${S.cTab === "prescricao" ? "on" : ""}" data-act="c-tab" data-v="prescricao">Prescrição</button></div>
    ${S.cTab === "consulta" ? consultaForm() : prescricaoTab()}</main>`;
}
function autosize() { document.querySelectorAll("textarea").forEach(t => { t.style.height = "auto"; t.style.height = Math.max(t.scrollHeight + 2, 64) + "px"; }); }

/* ---------- salvamento (rascunho) ---------- */
const setSt = t => { const e = $("#save-st"); if (e) e.textContent = t; };
function agendarSave() {
  S.dirty = true; S.ver++; setSt("Alterações não salvas…");
  clearTimeout(S.saveTimer); S.saveTimer = setTimeout(salvar, 1200);
}
const dadosConsulta = c => ({ ...Object.fromEntries(CAMPOS.map(k => [k, c[k] || ""])), diagnosticos: c.diagnosticos || [], dataConsulta: c.dataConsulta || hojeISO(), atualizadoEm: serverTimestamp() });
async function salvar() {
  clearTimeout(S.saveTimer);
  const c = S.consulta;
  if (!c || c.status !== "rascunho" || !S.dirty) return true;
  const v = S.ver; setSt("Salvando…");
  try { await updateDoc(refCons(c.id), dadosConsulta(c)); if (S.ver === v) S.dirty = false; setSt("Salvo às " + hora()); return true; }
  catch (e) { setSt("Erro ao salvar"); erro(e); return false; }
}
addEventListener("beforeunload", e => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- ações de consulta ---------- */
async function novaConsulta() {
  const p = S.paciente, tipo = S.consultas.length ? "retorno" : "primeira";
  const base = Object.fromEntries(CAMPOS.map(k => [k, ""]));
  if (tipo === "retorno") base.medicacoes = p.medicacoesAtuais || "";
  const ref = await addDoc(colPac("consultas"), {
    ...base, tipo, status: "rascunho", dataConsulta: hojeISO(),
    diagnosticos: tipo === "retorno" ? [...(p.diagnosticosAtuais || [])] : [],
    criadoEm: serverTimestamp(), atualizadoEm: serverTimestamp()
  });
  await carregarPaciente(p.id); await abrirConsulta(ref.id);
}
function addDiag() {
  const inp = $("#diag-in"); if (!inp) return;
  const t = inp.value.trim().replace(/\s+/g, " "); if (!t) return;
  const k = norm(t);
  if (!S.consulta.diagnosticos.some(d => norm(d) === k)) {
    const ex = S.pool.find(x => x.k === k);
    S.consulta.diagnosticos.push(ex ? ex.txt : t);
    if (!ex) { S.pool.push({ k, txt: t, n: 0 }); atualizarDatalist(); }
    renderChips(); agendarSave();
  }
  inp.value = ""; inp.focus();
}
async function finalizar() {
  const c = S.consulta, p = S.paciente;
  if (!CAMPOS.some(k => (c[k] || "").trim()) && !c.diagnosticos.length) return toast("A consulta está vazia.", true);
  if (!c.dataConsulta) return toast("Informe a data da consulta.", true);
  if (!confirm("Finalizar esta consulta?\n\nDepois de finalizada ela fica bloqueada; só será possível acrescentar adendos.")) return;
  if (!(await salvar())) return;
  const diag = c.diagnosticos.map(d => d.trim()).filter(Boolean);
  const b = writeBatch(db);
  b.update(refCons(c.id), { ...dadosConsulta(c), diagnosticos: diag, status: "finalizada", finalizadaEm: serverTimestamp() });
  b.update(refPac(p.id), { diagnosticosAtuais: diag, medicacoesAtuais: c.medicacoes || "", ultimaConsulta: c.dataConsulta, ultimaConsultaId: c.id, atualizadoEm: serverTimestamp() });
  await b.commit();
  S.dirty = false; toast("Consulta finalizada.");
  await carregarPaciente(p.id); await abrirConsulta(c.id);
}
async function descartar() {
  const c = S.consulta;
  if (S.prescricoes.some(r => r.consultaId === c.id)) return toast("Há prescrição emitida nesta consulta; ela não pode ser descartada. Finalize-a.", true);
  if (!confirm("Descartar este rascunho (e os exames adicionados nele)? Isso não pode ser desfeito.")) return;
  clearTimeout(S.saveTimer); S.dirty = false;
  const b = writeBatch(db);
  S.exames.filter(e => e.consultaId === c.id).forEach(e => b.delete(doc(db, "pacientes", S.paciente.id, "exames", e.id)));
  b.delete(refCons(c.id));
  await b.commit();
  await abrirPaciente(S.paciente.id);
}

/* ---------- impressão do receituário ---------- */
async function imprimirRx(r) {
  const nome = r.pacienteNome || S.paciente.nome;
  $("#print-area").innerHTML = `<table class="rx-t"><tbody><tr><td>
      <div class="rx-head"><img id="rx-logo" src="${LOGO}" alt=""></div>
      <div class="rx-meta"><div><b>Paciente:</b> ${esc(nome)}</div><div><b>Data:</b> ${fmtData(r.dataEmissao)}</div></div>
      <div class="rx-body">${esc(r.texto)}</div><div class="rx-sign"></div>
    </td></tr></tbody><tfoot><tr><td><div class="rx-spacer"></div></td></tr></tfoot></table>
    <div class="rx-foot">${esc(ENDERECO)}</div>`;
  try { await $("#rx-logo").decode(); } catch { }
  const t = document.title;
  document.title = ("Receita - " + nome + " - " + fmtData(r.dataEmissao)).replace(/[\\/:*?"<>|]/g, "-");
  addEventListener("afterprint", () => { document.title = t; }, { once: true });
  print();
}
async function emitirRx() {
  const texto = ($("#rx-txt").value || "").trim(), data = $("#rx-data").value || hojeISO();
  if (!texto) return toast("Escreva a prescrição.", true);
  if (!confirm("Emitir a prescrição?\n\nDepois de emitida ela fica gravada e não poderá ser alterada.")) return;
  const rx = { consultaId: S.consulta.id, texto, dataEmissao: data, pacienteNome: S.paciente.nome };
  const ref = await addDoc(colPac("prescricoes"), { ...rx, criadoEm: serverTimestamp() });
  S.rx = ""; await recarregarRx(); render();
  await imprimirRx({ ...rx, id: ref.id });
}

/* ---------- diálogo de paciente ---------- */
function dlgPaciente(p) {
  const d = $("#dlg");
  d.innerHTML = `<form id="f-pac" class="dlg-in"><h2>${p ? "Editar cadastro" : "Novo paciente"}</h2>
    <div class="fld"><label>Nome completo</label><input name="nome" class="inp" required autocomplete="off" value="${esc(p?.nome || "")}"></div>
    <div class="fld"><label>Data de nascimento</label><input name="nasc" type="date" class="inp" required max="${hojeISO()}" value="${p?.nascimento || ""}"></div>
    <div class="fld"><label>Sexo</label><select name="sexo" class="inp" required><option value="">Selecione…</option>
      ${Object.entries(SEXO).map(([v, l]) => `<option value="${v}"${p?.sexo === v ? " selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="row end"><button type="button" class="btn ghost" data-act="dlg-cancel">Cancelar</button><button class="btn primary">Salvar</button></div></form>`;
  d.showModal();
  $("#f-pac").onsubmit = async ev => {
    ev.preventDefault();
    try {
      const f = new FormData(ev.target), nome = f.get("nome").trim().replace(/\s+/g, " "), nasc = f.get("nasc"), sexo = f.get("sexo");
      if (!nome || !nasc || !sexo) return;
      if (!p) {
        const dup = S.pacientes.find(x => x._nome === norm(nome) && x.nascimento === nasc);
        if (dup && !confirm("Já existe um paciente com este nome e data de nascimento. Cadastrar mesmo assim?")) return;
        const ref = await addDoc(collection(db, "pacientes"), { nome, nascimento: nasc, sexo, diagnosticosAtuais: [], medicacoesAtuais: "", ultimaConsulta: null, criadoEm: serverTimestamp(), atualizadoEm: serverTimestamp() });
        d.close(); await abrirPaciente(ref.id);
      } else {
        await updateDoc(refPac(p.id), { nome, nascimento: nasc, sexo, atualizadoEm: serverTimestamp() });
        Object.assign(S.paciente, { nome, nascimento: nasc, sexo }); d.close(); render();
      }
    } catch (e) { erro(e); }
  };
}

/* ---------- eventos ---------- */
async function acao(a, el) {
  switch (a) {
    case "sair": if (!(await salvar())) return; await signOut(auth); break;
    case "home": await irHome(); break;
    case "modo": S.modo = el.dataset.v; render(); break;
    case "novo-pac": dlgPaciente(null); break;
    case "edit-pac": dlgPaciente(S.paciente); break;
    case "dlg-cancel": $("#dlg").close(); break;
    case "abrir-pac": await abrirPaciente(el.dataset.id); break;
    case "tab": S.tab = el.dataset.v; render(); break;
    case "nova-consulta": await novaConsulta(); break;
    case "abrir-consulta": await abrirConsulta(el.dataset.id); break;
    case "voltar-pac": if (!(await salvar())) return; await abrirPaciente(S.paciente.id); break;
    case "c-tab": S.cTab = el.dataset.v; render(); break;
    case "add-diag": addDiag(); break;
    case "rm-diag": S.consulta.diagnosticos.splice(+el.dataset.i, 1); renderChips(); agendarSave(); break;
    case "ex-add": {
      const tipo = $("#ex-tipo").value, data = $("#ex-data").value, texto = $("#ex-texto").value.trim();
      if (!data || !texto) return toast("Informe a data e o resultado do exame.", true);
      await addDoc(colPac("exames"), { tipo, data, texto, consultaId: S.consulta.id, criadoEm: serverTimestamp() });
      await recarregarExames(); renderExamesBox(); autosize(); break;
    }
    case "ex-rm":
      if (!confirm("Remover este exame?")) return;
      await deleteDoc(doc(db, "pacientes", S.paciente.id, "exames", el.dataset.id));
      await recarregarExames(); renderExamesBox(); break;
    case "finalizar": await finalizar(); break;
    case "descartar": await descartar(); break;
    case "ad-add": {
      const t = $("#ad-txt").value.trim(); if (!t) return;
      await addDoc(collection(db, "pacientes", S.paciente.id, "consultas", S.consulta.id, "adendos"), { texto: t, criadoEm: serverTimestamp() });
      await carregarAdendos(); render(); toast("Adendo registrado."); break;
    }
    case "rx-meds": {
      const m = (S.consulta.medicacoes || S.paciente.medicacoesAtuais || "").trim(), t = $("#rx-txt");
      if (!m) return toast("Não há medicações de uso registradas.", true);
      t.value = (t.value.trim() ? t.value.trim() + "\n\n" : "") + m; S.rx = t.value; autosize(); break;
    }
    case "rx-emitir": await emitirRx(); break;
    case "rx-print": { const r = S.prescricoes.find(x => x.id === el.dataset.id); if (r) await imprimirRx(r); break; }
    case "rx-base": { const r = S.prescricoes.find(x => x.id === el.dataset.id); if (r) { S.rx = r.texto; render(); toast("Texto copiado para a nova prescrição."); } break; }
  }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  acao(el.dataset.act, el).catch(erro);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { S.busca = t.value; renderLista(); return; }
  if (t.id === "rx-txt") { S.rx = t.value; }
  if (t.dataset?.campo && S.consulta?.status === "rascunho") { S.consulta[t.dataset.campo] = t.value; agendarSave(); }
  if (t.tagName === "TEXTAREA") { t.style.height = "auto"; t.style.height = Math.max(t.scrollHeight + 2, 64) + "px"; }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "diag-in") { e.preventDefault(); addDiag(); } });
document.addEventListener("submit", async e => {
  if (e.target.id !== "login") return;
  e.preventDefault();
  const err = $("#login-err"); err.textContent = "";
  try { await signInWithEmailAndPassword(auth, $("#em").value.trim(), $("#pw").value); }
  catch (x) {
    const c = x.code || "";
    err.textContent = /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? "E-mail ou senha incorretos." : c.includes("too-many") ? "Muitas tentativas. Aguarde alguns minutos." : "Não foi possível entrar: " + (x.message || c);
  }
});

/* ---------- início ---------- */
if (!CONFIGURADO) render();
else onAuthStateChanged(auth, u => {
  S.user = u;
  if (u) { iniciarPacientes(); S.view = "home"; }
  else { S.unsub?.(); S.unsub = null; S.pacientes = []; S.paciente = null; S.consulta = null; S.busca = ""; S.view = "login"; }
  render();
});
</script>
</body>
</html>
